<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pedidos del Día</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/recharts@2.8.0/umd/Recharts.min.js"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;
    const { BarChart, Bar, XAxis, YAxis, CartesianGrid, Tooltip, ResponsiveContainer, PieChart, Pie, Cell } = Recharts;

    /* ── CONFIG ─────────────────────────────────────────────────── */
    const ACCOUNTS = {
      LuisPe:  { password:"12345**", role:"user",        avatar:"JU", color:"#E81D2C", bg:"#FDF2F3", border:"#F5C0C4", text:"#3E171B" },
      Sebastian:  { password:"12345**", role:"user",        avatar:"PE", color:"#3E171B", bg:"#F4F0F1", border:"#C8B8BA", text:"#3E171B" },
      LuisPedro: { password:"12345**", role:"user",        avatar:"PA", color:"#A1CE5E", bg:"#F5FAF0", border:"#C8E4A0", text:"#3A5010" },
      Mariana:  { password:"12345**", role:"coordinator", avatar:"MA", color:"#666666", bg:"#F5F5F5", border:"#CCCCCC", text:"#333333" },
    };
    const ORDER_USERS = ["Juanito","Pedrito","Panchito"];
    const RESTAURANTS = ["San Martin","The Kitchen","Pollo Campero","McDonald's","Celeste Imperio"];
    const REST_META   = {
      "San Martin":      { color:"#E81D2C" },
      "The Kitchen":     { color:"#3E171B" },
      "Pollo Campero":   { color:"#A1CE5E" },
      "McDonald's":      { color:"#666666" },
      "Celeste Imperio": { color:"#3E171B" },
    };
    const CHART_PAL   = ["#E81D2C","#3E171B","#A1CE5E","#666666","#C0392B","#2C3E50"];
    const STORAGE_KEY = "pedidos_corp_v1";

    /* ── TOKENS ─────────────────────────────────────────────────── */
    const C = {
      red:"#E81D2C", redDark:"#C01020", dark:"#3E171B",
      green:"#A1CE5E", gray:"#666666", border:"#E0E0E0",
      bg:"#F7F7F7", white:"#FFFFFF", text:"#2A2A2A",
      muted:"#888888", light:"#F0F0F0",
    };

    /* ── UTILS ──────────────────────────────────────────────────── */
    function dayName(ds) {
      if (!ds) return "";
      return ["Domingo","Lunes","Martes","Miércoles","Jueves","Viernes","Sábado"][
        new Date(ds + "T12:00:00").getDay()
      ];
    }
    function getWeek() {
      const t = new Date(), dow = t.getDay(), diff = dow===0?-6:1-dow;
      const mon = new Date(t); mon.setDate(t.getDate()+diff);
      return ["Lunes","Martes","Miércoles","Jueves","Viernes"].map((name,i)=>{
        const d = new Date(mon); d.setDate(mon.getDate()+i);
        return { name, date:d.toISOString().split("T")[0], disp:d.toLocaleDateString("es-GT",{day:"2-digit",month:"short"}) };
      });
    }
    const WEEK  = getWeek();
    const TODAY = new Date().toISOString().split("T")[0];

    /* ── AVATAR ─────────────────────────────────────────────────── */
    function Avatar({ name, size=36 }) {
      const a = ACCOUNTS[name];
      return (
        <div style={{ width:size,height:size,borderRadius:4,background:a.color,display:"flex",alignItems:"center",justifyContent:"center",fontSize:size*0.32,fontWeight:800,color:"#fff",flexShrink:0 }}>
          {a.avatar}
        </div>
      );
    }

    /* ── REST PICKER ────────────────────────────────────────────── */
    function RestPicker({ value, onChange, small }) {
      return (
        <div style={{ display:"flex",flexWrap:"wrap",gap:small?4:6,marginBottom:small?8:14 }}>
          {RESTAURANTS.map(r => {
            const act = value===r;
            return (
              <button key={r} onClick={()=>onChange(r)} style={{ padding:small?"3px 10px":"6px 14px",borderRadius:3,border:`1.5px solid ${act?C.red:C.border}`,background:act?C.red:C.white,color:act?"#fff":C.gray,cursor:"pointer",fontSize:small?11:12,fontWeight:act?700:500,fontFamily:"Montserrat,sans-serif",transition:"all 0.15s" }}>
                {r}
              </button>
            );
          })}
        </div>
      );
    }

    /* ── TOAST ──────────────────────────────────────────────────── */
    function Toast({ msg }) {
      return msg ? <div style={{ background:C.dark,color:"#fff",padding:"10px 24px",textAlign:"center",fontSize:12,fontWeight:600 }}>{msg}</div> : null;
    }

    /* ── SECTION TITLE ──────────────────────────────────────────── */
    function SectionTitle({ children, sub }) {
      return (
        <div style={{ marginBottom:20 }}>
          <h2 style={{ fontSize:14,fontWeight:800,color:C.dark,letterSpacing:0.5,textTransform:"uppercase",margin:0,display:"flex",alignItems:"center",gap:10 }}>
            <span style={{ width:3,height:16,background:C.red,borderRadius:2,display:"inline-block",flexShrink:0 }}/>
            {children}
          </h2>
          {sub && <p style={{ fontSize:11,color:C.muted,margin:"5px 0 0 13px",fontWeight:500 }}>{sub}</p>}
        </div>
      );
    }

    /* ── METRICS ────────────────────────────────────────────────── */
    function MetricsView({ orders }) {
      const thisWeek   = orders.filter(o=>WEEK.some(d=>d.date===o.date));
      const totalUnits = orders.reduce((s,o)=>s+ +o.qty,0);
      const avgQty     = orders.length?(totalUnits/orders.length).toFixed(1):"–";

      const restAgg={};
      orders.forEach(o=>{restAgg[o.restaurant]=(restAgg[o.restaurant]||0)+ +o.qty;});
      const topRest=Object.entries(restAgg).sort((a,b)=>b[1]-a[1])[0]?.[0]||"–";

      const userAgg={};
      ORDER_USERS.forEach(u=>{userAgg[u]=orders.filter(o=>o.user===u).reduce((s,o)=>s+ +o.qty,0);});
      const topUser=Object.entries(userAgg).sort((a,b)=>b[1]-a[1])[0]?.[0]||"–";

      const userChartData = ORDER_USERS.map(u=>({ nombre:u, pedidos:orders.filter(o=>o.user===u).length, unidades:orders.filter(o=>o.user===u).reduce((s,o)=>s+ +o.qty,0) }));
      const restChartData = RESTAURANTS.map(r=>({ nombre:r.length>11?r.slice(0,11)+"…":r, unidades:orders.filter(o=>o.restaurant===r).reduce((s,o)=>s+ +o.qty,0) })).filter(r=>r.unidades>0);
      const dayChartData  = ["Lunes","Martes","Miércoles","Jueves","Viernes"].map(d=>({ dia:d.slice(0,3), pedidos:orders.filter(o=>o.dayName===d).length }));
      const pieData       = ORDER_USERS.map(u=>({ name:u, value:orders.filter(o=>o.user===u).length })).filter(d=>d.value>0);

      const kpis = [
        {lbl:"Total Pedidos",     val:orders.length,   col:C.red,   sub:"registros totales"},
        {lbl:"Esta Semana",       val:thisWeek.length, col:C.dark,  sub:"pedidos activos"},
        {lbl:"Total Unidades",    val:totalUnits,      col:C.green, sub:"platos solicitados"},
        {lbl:"Promedio/Pedido",   val:avgQty,          col:C.gray,  sub:"unidades promedio"},
      ];

      return (
        <div>
          <SectionTitle sub="Resumen general de pedidos y actividad del equipo">Panel de Métricas</SectionTitle>
          <div className="kpi-grid" style={{marginBottom:16}}>
            {kpis.map(k=>(
              <div key={k.lbl} className="kpi-card">
                <div className="kpi-card__accent" style={{background:k.col}}/>
                <div className="kpi-card__val" style={{color:k.col}}>{k.val}</div>
                <div className="kpi-card__lbl">{k.lbl}</div>
                <div className="kpi-card__sub">{k.sub}</div>
              </div>
            ))}
          </div>

          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:16}}>
            <div className="highlight-card" style={{borderLeft:`4px solid ${C.red}`}}>
              <div className="highlight-card__lbl">Restaurante más solicitado</div>
              <div className="highlight-card__val">{topRest}</div>
            </div>
            <div className="highlight-card" style={{borderLeft:`4px solid ${C.green}`}}>
              <div className="highlight-card__lbl">Colaborador más activo</div>
              <div className="highlight-card__val">{topUser}</div>
            </div>
          </div>

          {orders.length===0 ? (
            <div className="empty-state">Sin pedidos registrados. Las métricas aparecerán aquí cuando se agreguen pedidos.</div>
          ) : (
            <>
              <div className="card" style={{marginBottom:14}}>
                <div className="card__title">Pedidos por colaborador</div>
                {userChartData.map(u=>{
                  const a=ACCOUNTS[u.nombre], pct=orders.length?Math.round((u.pedidos/orders.length)*100):0;
                  return (
                    <div key={u.nombre} style={{marginBottom:16}}>
                      <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:6}}>
                        <Avatar name={u.nombre} size={26}/>
                        <span style={{fontSize:12,fontWeight:700,flex:1,color:C.text}}>{u.nombre}</span>
                        <span style={{fontSize:11,color:C.muted}}>{u.pedidos} ped. · {u.unidades} uds.</span>
                        <span style={{fontSize:12,fontWeight:700,color:a.color,minWidth:36,textAlign:"right"}}>{pct}%</span>
                      </div>
                      <div style={{background:C.light,borderRadius:2,height:6,overflow:"hidden"}}>
                        <div style={{height:"100%",borderRadius:2,background:a.color,width:`${pct}%`,transition:"width 0.5s ease"}}/>
                      </div>
                    </div>
                  );
                })}
              </div>

              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:14}}>
                <div className="card">
                  <div className="card__title">Unidades por restaurante</div>
                  <ResponsiveContainer width="100%" height={160}>
                    <BarChart data={restChartData} margin={{top:4,right:0,left:-24,bottom:0}}>
                      <CartesianGrid strokeDasharray="2 4" stroke="#EBEBEB" vertical={false}/>
                      <XAxis dataKey="nombre" tick={{fontSize:8,fill:C.muted,fontFamily:"Montserrat"}}/>
                      <YAxis tick={{fontSize:9,fill:C.muted,fontFamily:"Montserrat"}}/>
                      <Tooltip contentStyle={{fontSize:11,borderRadius:3,border:`1px solid ${C.border}`,fontFamily:"Montserrat"}}/>
                      <Bar dataKey="unidades" radius={[2,2,0,0]}>
                        {restChartData.map((_,i)=><Cell key={i} fill={CHART_PAL[i%CHART_PAL.length]}/>)}
                      </Bar>
                    </BarChart>
                  </ResponsiveContainer>
                </div>
                <div className="card">
                  <div className="card__title">Pedidos por día</div>
                  <ResponsiveContainer width="100%" height={160}>
                    <BarChart data={dayChartData} margin={{top:4,right:0,left:-24,bottom:0}}>
                      <CartesianGrid strokeDasharray="2 4" stroke="#EBEBEB" vertical={false}/>
                      <XAxis dataKey="dia" tick={{fontSize:10,fill:C.muted,fontFamily:"Montserrat"}}/>
                      <YAxis tick={{fontSize:9,fill:C.muted,fontFamily:"Montserrat"}} allowDecimals={false}/>
                      <Tooltip contentStyle={{fontSize:11,borderRadius:3,border:`1px solid ${C.border}`,fontFamily:"Montserrat"}}/>
                      <Bar dataKey="pedidos" fill={C.red} radius={[2,2,0,0]}/>
                    </BarChart>
                  </ResponsiveContainer>
                </div>
              </div>

              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:14}}>
                {pieData.length>1&&(
                  <div className="card">
                    <div className="card__title">Distribución de pedidos</div>
                    <ResponsiveContainer width="100%" height={150}>
                      <PieChart>
                        <Pie data={pieData} cx="50%" cy="50%" outerRadius={55} dataKey="value" label={({name,percent})=>`${name} ${Math.round(percent*100)}%`} labelLine={false} style={{fontSize:9,fontFamily:"Montserrat"}}>
                          {pieData.map((_,i)=><Cell key={i} fill={CHART_PAL[i%CHART_PAL.length]}/>)}
                        </Pie>
                        <Tooltip contentStyle={{fontSize:11,fontFamily:"Montserrat"}}/>
                      </PieChart>
                    </ResponsiveContainer>
                  </div>
                )}
                <div className="card">
                  <div className="card__title">Semana actual</div>
                  <div style={{display:"grid",gridTemplateColumns:"repeat(5,1fr)",gap:6,marginTop:8}}>
                    {WEEK.map(d=>{
                      const n=orders.filter(o=>o.date===d.date).length, isT=d.date===TODAY;
                      return (
                        <div key={d.date} className={`week-cell ${isT?"week-cell--today":""}`}>
                          <div className="week-cell__day">{d.name.slice(0,3)}</div>
                          <div className="week-cell__num" style={{color:n>0?C.red:C.border}}>{n}</div>
                          <div className="week-cell__date">{d.disp}</div>
                        </div>
                      );
                    })}
                  </div>
                </div>
              </div>
            </>
          )}
        </div>
      );
    }

    /* ── EVERYONE VIEW ──────────────────────────────────────────── */
    function EveryoneView({ orders, onDelete }) {
      return (
        <div>
          <SectionTitle sub="Pedidos individuales de cada colaborador">Por Colaborador</SectionTitle>
          {ORDER_USERS.map(u=>{
            const a=ACCOUNTS[u], uOrders=orders.filter(o=>o.user===u).sort((a,b)=>a.date.localeCompare(b.date));
            return (
              <div key={u} className="card" style={{marginBottom:12}}>
                <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:14,paddingBottom:12,borderBottom:`1px solid ${C.border}`}}>
                  <Avatar name={u} size={40}/>
                  <div style={{flex:1}}>
                    <div style={{fontSize:14,fontWeight:700,color:C.dark}}>{u}</div>
                    <div style={{fontSize:11,color:C.muted,marginTop:2}}>{uOrders.length} pedido(s) · {uOrders.reduce((s,o)=>s+ +o.qty,0)} unidades</div>
                  </div>
                  <div className="chip" style={{background:a.bg,color:a.text,border:`1px solid ${a.border}`}}>{new Set(uOrders.map(o=>o.restaurant)).size} restaurantes</div>
                </div>
                {uOrders.length===0 ? (
                  <p style={{margin:0,color:C.muted,fontSize:12}}>Sin pedidos registrados.</p>
                ) : (
                  <table className="data-table">
                    <thead><tr><th>Restaurante</th><th>Plato</th><th>Cant.</th><th>Fecha</th><th>Obs.</th><th></th></tr></thead>
                    <tbody>
                      {uOrders.map(o=>(
                        <tr key={o.id}>
                          <td><span style={{display:"flex",alignItems:"center",gap:6}}><span style={{width:7,height:7,borderRadius:"50%",background:REST_META[o.restaurant]?.color,display:"inline-block",flexShrink:0}}/><span style={{fontSize:11,fontWeight:700,color:REST_META[o.restaurant]?.color}}>{o.restaurant}</span></span></td>
                          <td>{o.item}</td>
                          <td style={{textAlign:"center",fontWeight:700}}>{o.qty}</td>
                          <td style={{color:C.muted,fontSize:11,whiteSpace:"nowrap"}}>{o.dayName} {o.date.slice(5)}</td>
                          <td style={{color:C.muted,fontSize:11,fontStyle:"italic",maxWidth:100,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{o.note||"—"}</td>
                          <td><button onClick={()=>onDelete(o.id)} className="btn-icon-del">×</button></td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                )}
              </div>
            );
          })}
        </div>
      );
    }

    /* ── MAIN APP ───────────────────────────────────────────────── */
    function App() {
      const [auth,setAuth]=useState(null);
      const [loginName,setLoginName]=useState("Juanito");
      const [loginPwd,setLoginPwd]=useState("");
      const [loginErr,setLoginErr]=useState("");
      const [pwdVisible,setPwdVisible]=useState(false);
      const [tab,setTab]=useState("order");
      const [orders,setOrders]=useState([]);
      const [ready,setReady]=useState(false);
      const [toast,setToast]=useState("");
      const [form,setForm]=useState({restaurant:"",item:"",qty:1,note:"",date:TODAY});
      const mkSched=()=>Object.fromEntries(WEEK.map(d=>[d.date,{on:false,restaurant:"",item:"",qty:1,note:""}]));
      const [sched,setSched]=useState(mkSched);

      useEffect(()=>{
        try{const r=localStorage.getItem(STORAGE_KEY);if(r)setOrders(JSON.parse(r));}catch{}
        setReady(true);
      },[]);
      useEffect(()=>{
        if(!ready)return;
        try{localStorage.setItem(STORAGE_KEY,JSON.stringify(orders));}catch{}
      },[orders,ready]);
      useEffect(()=>{
        if(!auth)return;
        const ns=mkSched();
        orders.filter(o=>o.user===auth.name&&WEEK.some(d=>d.date===o.date)).forEach(o=>{ns[o.date]={on:true,restaurant:o.restaurant,item:o.item,qty:o.qty,note:o.note||""};});
        setSched(ns);
      },[auth&&auth.name]);

      function notify(msg){setToast(msg);setTimeout(()=>setToast(""),2800);}
      function login(){
        const acc=ACCOUNTS[loginName];
        if(!acc||loginPwd!==acc.password){setLoginErr("Contraseña incorrecta. Intenta de nuevo.");return;}
        setLoginErr("");setLoginPwd("");
        setAuth({name:loginName,role:acc.role});
        setTab(acc.role==="coordinator"?"metrics":"order");
      }
      function logout(){setAuth(null);setLoginPwd("");setLoginErr("");}
      function addOrder(){
        if(!form.restaurant)return notify("Selecciona un restaurante");
        if(!form.item.trim())return notify("Escribe lo que quieres pedir");
        setOrders(p=>[...p,{id:`${Date.now()}-${Math.random()}`,user:auth.name,...form,qty:+form.qty,dayName:dayName(form.date),ts:Date.now()}]);
        setForm({restaurant:"",item:"",qty:1,note:"",date:TODAY});
        notify("Pedido guardado correctamente");
      }
      function saveSchedule(){
        const active=WEEK.filter(d=>sched[d.date]?.on&&sched[d.date]?.restaurant&&sched[d.date]?.item?.trim());
        if(!active.length)return notify("Activa al menos un día con datos completos");
        const wDates=WEEK.map(d=>d.date);
        setOrders(p=>[...p.filter(o=>!(o.user===auth.name&&wDates.includes(o.date))),...active.map(d=>({id:`sch-${Date.now()}-${d.date}`,user:auth.name,date:d.date,restaurant:sched[d.date].restaurant,item:sched[d.date].item,qty:+sched[d.date].qty||1,note:sched[d.date].note||"",dayName:d.name,ts:Date.now()}))]);
        notify(`${active.length} día(s) programado(s) correctamente`);
      }
      function deleteOrder(id){setOrders(p=>p.filter(o=>o.id!==id));}
      function exportExcel(){
        if(!orders.length)return notify("No hay pedidos para exportar");
        const wb=XLSX.utils.book_new();
        const sort=[...orders].sort((a,b)=>a.date.localeCompare(b.date));
        XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(sort.map(o=>({Solicitante:o.user,Restaurante:o.restaurant,"Menú":o.item,Cantidad:o.qty,Observación:o.note||"-",Fecha:o.date,Día:o.dayName}))),"Todos los Pedidos");
        const agg={};
        orders.forEach(o=>{const k=`${o.restaurant}|${o.item}`;if(!agg[k])agg[k]={Restaurante:o.restaurant,Plato:o.item,"Total Unidades":0,Detalle:[]};agg[k]["Total Unidades"]+=+o.qty;agg[k].Detalle.push(`${o.user}(${o.qty})`);});
        XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(Object.values(agg).map(r=>({...r,Detalle:r.Detalle.join(", ")}))),"Consolidado");
        ORDER_USERS.forEach(u=>{const rows=orders.filter(o=>o.user===u).sort((a,b)=>a.date.localeCompare(b.date));if(rows.length)XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows.map(o=>({Restaurante:o.restaurant,"Menú":o.item,Cantidad:o.qty,Observación:o.note||"-",Fecha:o.date,Día:o.dayName}))),u);});
        XLSX.writeFile(wb,`pedidos_${TODAY}.xlsx`);
        notify("Excel descargado exitosamente");
      }

      /* LOGIN */
      if(!auth){
        return (
          <div className="login-screen">
            <div className="login-panel">
              <div className="login-brand">
                <div className="login-logo">
                  <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
                    <rect width="22" height="22" rx="4" fill="#E81D2C"/>
                    <path d="M11 3C8.5 3 6.5 5.2 6.5 8c0 2.2 1.2 4 2.7 5.6L11 16.5l1.8-2.9c1.5-1.6 2.7-3.4 2.7-5.6C15.5 5.2 13.5 3 11 3z" fill="rgba(255,255,255,0.95)"/>
                    <circle cx="11" cy="8" r="2" fill="#E81D2C"/>
                    <rect x="9.5" y="18" width="3" height="1.5" rx="0.75" fill="rgba(255,255,255,0.55)"/>
                  </svg>
                </div>
                <div>
                  <h1 className="login-title">Pedidos del Día</h1>
                  <p className="login-sub">Sistema de consolidación de pedidos</p>
                </div>
              </div>

              <div className="login-divider"/>

              <div style={{marginBottom:22}}>
                <span className="week-badge">Semana: {WEEK[0]?.disp} — {WEEK[4]?.disp}</span>
              </div>

              <div style={{marginBottom:20}}>
                <label className="field-label">Selecciona tu usuario</label>
                <div style={{display:"flex",flexDirection:"column",gap:7}}>
                  {Object.entries(ACCOUNTS).map(([name,acc])=>{
                    const active=loginName===name;
                    return (
                      <button key={name} onClick={()=>{setLoginName(name);setLoginErr("");}}
                        className={`user-row ${active?"user-row--active":""}`}
                        style={{borderColor:active?acc.color:C.border}}>
                        <div className="user-row__av" style={{background:acc.color}}>{acc.avatar}</div>
                        <div style={{flex:1,textAlign:"left"}}>
                          <div style={{fontSize:13,fontWeight:700,color:active?acc.color:C.text}}>{name}</div>
                          <div style={{fontSize:10,color:C.muted,marginTop:1}}>{acc.role==="coordinator"?"Coordinadora · Acceso completo":"Colaborador · Pedidos y agenda"}</div>
                        </div>
                        {active&&<div className="user-row__check" style={{background:acc.color}}><svg width="9" height="7" viewBox="0 0 9 7" fill="none"><path d="M1 3.5l2.5 2.5 4.5-5" stroke="#fff" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round"/></svg></div>}
                      </button>
                    );
                  })}
                </div>
              </div>

              <div style={{marginBottom:20}}>
                <label className="field-label">Contraseña</label>
                <div style={{position:"relative"}}>
                  <input type={pwdVisible?"text":"password"} value={loginPwd}
                    onChange={e=>{setLoginPwd(e.target.value);setLoginErr("");}}
                    onKeyDown={e=>e.key==="Enter"&&login()}
                    placeholder="Ingresa tu contraseña" className="field-input"
                    style={{borderColor:loginErr?"#E81D2C":C.border}}/>
                  <button onClick={()=>setPwdVisible(v=>!v)} className="pwd-eye">{pwdVisible?"◎":"●"}</button>
                </div>
                {loginErr&&<p className="field-error">{loginErr}</p>}
              </div>

              <button onClick={login} className="btn-primary btn-full">Ingresar</button>
              <p className="login-footer">Sistema interno · Uso exclusivo del equipo</p>
            </div>
          </div>
        );
      }

      /* APP PRINCIPAL */
      const myOrders  = orders.filter(o=>o.user===auth.name).sort((a,b)=>a.date.localeCompare(b.date));
      const allSorted = [...orders].sort((a,b)=>a.date.localeCompare(b.date));
      const byDate    = allSorted.reduce((acc,o)=>{(acc[o.date]=acc[o.date]||[]).push(o);return acc;},{});
      const restSumm  = orders.reduce((acc,o)=>{if(!acc[o.restaurant])acc[o.restaurant]={total:0,items:{}};acc[o.restaurant].total+=+o.qty;acc[o.restaurant].items[o.item]=(acc[o.restaurant].items[o.item]||0)+ +o.qty;return acc;},{});

      const USER_TABS  = [{id:"order",label:"Nuevo Pedido"},{id:"schedule",label:"Mi Semana"},{id:"mine",label:"Mis Pedidos",badge:myOrders.length}];
      const COORD_TABS = [{id:"metrics",label:"Métricas"},{id:"all",label:"Consolidado",badge:orders.length},{id:"everyone",label:"Por Colaborador"}];
      const TABS = auth.role==="coordinator"?[...USER_TABS,...COORD_TABS]:USER_TABS;
      const acct = ACCOUNTS[auth.name];

      return (
        <div className="app-shell">
          {/* HEADER */}
          <header className="app-header">
            <div style={{display:"flex",alignItems:"center",gap:12}}>
              <div style={{width:32,height:32,borderRadius:4,background:C.red,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
                <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
                  <path d="M9 2C6.8 2 5 4 5 6.5c0 2 1 3.8 2.2 5.2L9 14l1.8-2.3C12 10.3 13 8.5 13 6.5 13 4 11.2 2 9 2z" fill="rgba(255,255,255,0.9)"/>
                  <circle cx="9" cy="6.5" r="1.8" fill="#E81D2C"/>
                  <rect x="8" y="15" width="2" height="1.5" rx="0.75" fill="rgba(255,255,255,0.55)"/>
                </svg>
              </div>
              <div>
                <span className="header-appname">Pedidos del Día</span>
                <span className="header-week"> · Semana {WEEK[0]?.disp} – {WEEK[4]?.disp}</span>
              </div>
            </div>
            <div style={{display:"flex",alignItems:"center",gap:12}}>
              <div style={{display:"flex",alignItems:"center",gap:8}}>
                <div className="header-av" style={{background:acct.color}}>{acct.avatar}</div>
                <div>
                  <div style={{fontSize:12,fontWeight:700,color:C.dark}}>{auth.name}</div>
                  {auth.role==="coordinator"&&<div style={{fontSize:9,fontWeight:700,color:C.red,textTransform:"uppercase",letterSpacing:0.8}}>Coordinadora</div>}
                </div>
              </div>
              <button onClick={logout} className="btn-ghost-sm">Salir</button>
            </div>
          </header>

          <Toast msg={toast}/>

          <div className="app-layout">
            {/* SIDEBAR */}
            <nav className="sidebar">
              <div className="sidebar__section-lbl">NAVEGACIÓN</div>
              {TABS.map(t=>(
                <button key={t.id} onClick={()=>setTab(t.id)} className={`sidebar__item ${tab===t.id?"sidebar__item--active":""}`}>
                  <span>{t.label}</span>
                  {t.badge>0&&<span className={`sidebar__badge ${tab===t.id?"sidebar__badge--active":""}`}>{t.badge}</span>}
                </button>
              ))}
              <div className="sidebar__divider"/>
              <div style={{padding:"0 14px"}}>
                <div style={{fontSize:9,color:C.muted,textTransform:"uppercase",letterSpacing:0.8,marginBottom:6,fontWeight:700}}>Total global</div>
                <div style={{fontSize:26,fontWeight:900,color:C.dark,lineHeight:1}}>{orders.length}</div>
                <div style={{fontSize:10,color:C.muted,marginTop:2}}>pedidos registrados</div>
              </div>
            </nav>

            {/* CONTENT */}
            <main className="main-content">

              {/* NUEVO PEDIDO */}
              {tab==="order"&&(
                <div>
                  <SectionTitle sub="Registra tu pedido para el día seleccionado">Nuevo Pedido</SectionTitle>
                  <div className="card">
                    <div className="form-group" style={{marginBottom:14}}>
                      <label className="field-label">Restaurante</label>
                      <RestPicker value={form.restaurant} onChange={r=>setForm(f=>({...f,restaurant:r}))}/>
                    </div>
                    <div className="form-grid-2">
                      <div className="form-group">
                        <label className="field-label">Menú / Plato</label>
                        <input className="field-input" placeholder="Ej: Combo pollo con papas…" value={form.item} onChange={e=>setForm(f=>({...f,item:e.target.value}))}/>
                      </div>
                      <div className="form-group">
                        <label className="field-label">Cantidad</label>
                        <input type="number" min="1" max="20" className="field-input" value={form.qty} onChange={e=>setForm(f=>({...f,qty:e.target.value}))}/>
                      </div>
                      <div className="form-group">
                        <label className="field-label">Observaciones especiales</label>
                        <input className="field-input" placeholder="Sin cebolla, sin gluten, para llevar…" value={form.note} onChange={e=>setForm(f=>({...f,note:e.target.value}))}/>
                      </div>
                      <div className="form-group">
                        <label className="field-label">Fecha del pedido</label>
                        <input type="date" className="field-input" value={form.date} onChange={e=>setForm(f=>({...f,date:e.target.value}))}/>
                      </div>
                    </div>
                    <div style={{marginTop:20,paddingTop:16,borderTop:`1px solid ${C.border}`}}>
                      <button onClick={addOrder} className="btn-primary">Guardar Pedido</button>
                    </div>
                  </div>
                </div>
              )}

              {/* MI SEMANA */}
              {tab==="schedule"&&(
                <div>
                  <SectionTitle sub="Planifica tus pedidos para toda la semana de una vez">Mi Semana</SectionTitle>
                  <div className="card">
                    <p style={{fontSize:12,color:C.muted,marginBottom:18,lineHeight:1.7}}>
                      Activa los días que deseas programar, completa los datos y guarda. Se reemplazará la programación anterior de los días seleccionados.
                    </p>
                    <div style={{display:"flex",flexDirection:"column",gap:8}}>
                      {WEEK.map(d=>{
                        const isPast=d.date<TODAY, isToday=d.date===TODAY, dd=sched[d.date]||{};
                        return (
                          <div key={d.date} className={`schedule-row ${dd.on?"schedule-row--active":""} ${isPast?"schedule-row--past":""}`}>
                            <div className="schedule-row__header">
                              <label className="schedule-row__label">
                                <input type="checkbox" checked={!!dd.on} disabled={isPast} onChange={e=>setSched(s=>({...s,[d.date]:{...s[d.date],on:e.target.checked}}))} style={{accentColor:C.red,marginRight:10}}/>
                                <span style={{fontWeight:700,fontSize:13}}>{d.name}</span>
                                <span style={{color:C.muted,fontSize:12,fontWeight:400,marginLeft:8}}>{d.disp}</span>
                                {isToday&&<span className="badge-today">Hoy</span>}
                                {isPast&&<span style={{fontSize:10,color:C.muted,marginLeft:6}}>· pasado</span>}
                              </label>
                            </div>
                            {dd.on&&(
                              <div className="schedule-row__fields">
                                <RestPicker value={dd.restaurant} onChange={r=>setSched(s=>({...s,[d.date]:{...s[d.date],restaurant:r}}))} small/>
                                <div className="form-grid-3">
                                  <div className="form-group" style={{gridColumn:"1 / 3"}}>
                                    <label className="field-label">Plato</label>
                                    <input className="field-input field-input--sm" placeholder="¿Qué quieres pedir?" value={dd.item||""} onChange={e=>setSched(s=>({...s,[d.date]:{...s[d.date],item:e.target.value}}))}/>
                                  </div>
                                  <div className="form-group">
                                    <label className="field-label">Cant.</label>
                                    <input type="number" min="1" className="field-input field-input--sm" value={dd.qty||1} onChange={e=>setSched(s=>({...s,[d.date]:{...s[d.date],qty:e.target.value}}))}/>
                                  </div>
                                  <div className="form-group" style={{gridColumn:"1 / -1"}}>
                                    <label className="field-label">Observaciones</label>
                                    <input className="field-input field-input--sm" placeholder="Observaciones especiales…" value={dd.note||""} onChange={e=>setSched(s=>({...s,[d.date]:{...s[d.date],note:e.target.value}}))}/>
                                  </div>
                                </div>
                              </div>
                            )}
                          </div>
                        );
                      })}
                    </div>
                    <div style={{marginTop:20,paddingTop:16,borderTop:`1px solid ${C.border}`}}>
                      <button onClick={saveSchedule} className="btn-success">Guardar Programación Semanal</button>
                    </div>
                  </div>
                </div>
              )}

              {/* MIS PEDIDOS */}
              {tab==="mine"&&(
                <div>
                  <SectionTitle sub="Historial de tus pedidos registrados">Mis Pedidos</SectionTitle>
                  {myOrders.length===0?(
                    <div className="empty-state">No tienes pedidos registrados. Usa "Nuevo Pedido" o "Mi Semana" para agregar.</div>
                  ):(
                    <>
                      <div className="kpi-grid" style={{marginBottom:16}}>
                        {[{lbl:"Total",val:myOrders.length,col:C.red},{lbl:"Esta semana",val:myOrders.filter(o=>WEEK.some(d=>d.date===o.date)).length,col:C.dark},{lbl:"Restaurantes",val:new Set(myOrders.map(o=>o.restaurant)).size,col:C.green},{lbl:"Unidades",val:myOrders.reduce((s,o)=>s+ +o.qty,0),col:C.gray}].map(s=>(
                          <div key={s.lbl} className="kpi-card">
                            <div className="kpi-card__accent" style={{background:s.col}}/>
                            <div className="kpi-card__val" style={{color:s.col}}>{s.val}</div>
                            <div className="kpi-card__lbl">{s.lbl}</div>
                          </div>
                        ))}
                      </div>
                      <div className="card" style={{padding:0}}>
                        <table className="data-table">
                          <thead><tr><th>Restaurante</th><th>Plato</th><th>Cant.</th><th>Día</th><th>Observación</th><th></th></tr></thead>
                          <tbody>
                            {myOrders.map(o=>(
                              <tr key={o.id}>
                                <td><span style={{display:"flex",alignItems:"center",gap:6}}><span style={{width:7,height:7,borderRadius:"50%",background:REST_META[o.restaurant]?.color,display:"inline-block",flexShrink:0}}/><span style={{fontSize:11,fontWeight:700,color:REST_META[o.restaurant]?.color}}>{o.restaurant}</span></span></td>
                                <td style={{fontWeight:600}}>{o.item}</td>
                                <td style={{textAlign:"center",fontWeight:800,color:C.red}}>{o.qty}</td>
                                <td style={{color:C.muted,fontSize:11,whiteSpace:"nowrap"}}>{o.dayName}<br/><span style={{fontSize:10}}>{o.date}</span></td>
                                <td style={{color:C.muted,fontSize:11,fontStyle:"italic"}}>{o.note||"—"}</td>
                                <td><button onClick={()=>deleteOrder(o.id)} className="btn-icon-del">×</button></td>
                              </tr>
                            ))}
                          </tbody>
                        </table>
                      </div>
                    </>
                  )}
                </div>
              )}

              {/* MÉTRICAS */}
              {tab==="metrics"&&auth.role==="coordinator"&&<MetricsView orders={orders}/>}

              {/* CONSOLIDADO */}
              {tab==="all"&&auth.role==="coordinator"&&(
                <div>
                  <div style={{display:"flex",alignItems:"flex-start",justifyContent:"space-between",marginBottom:20}}>
                    <SectionTitle sub={`${orders.length} pedidos · ${ORDER_USERS.join(", ")}`}>Consolidado</SectionTitle>
                    <button onClick={exportExcel} className="btn-outline-dark">↓ Exportar Excel</button>
                  </div>

                  <div className="kpi-grid" style={{marginBottom:16}}>
                    {ORDER_USERS.map(u=>{
                      const a=ACCOUNTS[u],n=orders.filter(o=>o.user===u).length;
                      return (
                        <div key={u} className="kpi-card" style={{background:a.bg,borderColor:a.border}}>
                          <div className="kpi-card__accent" style={{background:a.color}}/>
                          <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:8}}><Avatar name={u} size={22}/><span style={{fontSize:12,fontWeight:700,color:a.text}}>{u}</span></div>
                          <div className="kpi-card__val" style={{color:a.color,fontSize:24}}>{n}</div>
                          <div className="kpi-card__sub">{orders.filter(o=>o.user===u).reduce((s,o)=>s+ +o.qty,0)} unidades</div>
                        </div>
                      );
                    })}
                  </div>

                  {orders.length===0?(
                    <div className="empty-state">No hay pedidos registrados aún.</div>
                  ):(
                    <>
                      {Object.entries(byDate).map(([date,dayOrders])=>(
                        <div key={date} className="card" style={{marginBottom:12}}>
                          <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:12,paddingBottom:10,borderBottom:`1px solid ${C.border}`}}>
                            <div style={{background:C.dark,color:"#fff",borderRadius:3,padding:"3px 10px",fontSize:11,fontWeight:800,flexShrink:0}}>{dayName(date).slice(0,3).toUpperCase()}</div>
                            <span style={{fontSize:13,fontWeight:700,color:C.dark}}>{dayName(date)} · {date}</span>
                            <span style={{fontSize:11,color:C.muted,marginLeft:"auto"}}>{dayOrders.length} pedido(s)</span>
                          </div>
                          <table className="data-table">
                            <thead><tr><th>Colaborador</th><th>Restaurante</th><th>Plato</th><th>Cant.</th><th>Obs.</th></tr></thead>
                            <tbody>
                              {dayOrders.map(o=>{
                                const ac=ACCOUNTS[o.user];
                                return (
                                  <tr key={o.id}>
                                    <td><span className="chip" style={{background:ac?.bg,color:ac?.text,border:`1px solid ${ac?.border}`}}>{o.user}</span></td>
                                    <td><span style={{fontSize:11,fontWeight:700,color:REST_META[o.restaurant]?.color}}>{o.restaurant}</span></td>
                                    <td style={{fontWeight:500}}>{o.item}</td>
                                    <td style={{textAlign:"center",fontWeight:800,color:C.red}}>{o.qty}</td>
                                    <td style={{color:C.muted,fontSize:11,fontStyle:"italic"}}>{o.note||"—"}</td>
                                  </tr>
                                );
                              })}
                            </tbody>
                          </table>
                        </div>
                      ))}

                      <div className="card">
                        <div className="card__title">Resumen por Restaurante</div>
                        <table className="data-table" style={{marginTop:10}}>
                          <thead><tr><th>Restaurante</th><th>Plato</th><th>Unidades</th></tr></thead>
                          <tbody>
                            {Object.entries(restSumm).flatMap(([rest,data])=>
                              Object.entries(data.items).map(([item,qty],i)=>(
                                <tr key={`${rest}-${item}`}>
                                  {i===0&&<td rowSpan={Object.keys(data.items).length} style={{fontWeight:700,color:REST_META[rest]?.color,verticalAlign:"top",paddingTop:10}}>
                                    <span style={{display:"flex",alignItems:"center",gap:6}}>
                                      <span style={{width:8,height:8,borderRadius:"50%",background:REST_META[rest]?.color,display:"inline-block",flexShrink:0}}/>
                                      {rest}
                                    </span>
                                  </td>}
                                  <td>{item}</td>
                                  <td style={{textAlign:"center",fontWeight:800,color:C.red}}>{qty}</td>
                                </tr>
                              ))
                            )}
                          </tbody>
                          <tfoot>
                            <tr>
                              <td colSpan={2} style={{fontWeight:800,color:C.dark,textAlign:"right",paddingRight:16}}>TOTAL GENERAL</td>
                              <td style={{textAlign:"center",fontWeight:900,color:C.red,fontSize:15}}>{orders.reduce((s,o)=>s+ +o.qty,0)}</td>
                            </tr>
                          </tfoot>
                        </table>
                      </div>

                      <div style={{textAlign:"right",marginTop:12}}>
                        <button onClick={()=>{if(window.confirm("¿Eliminar todos los pedidos? Esta acción no se puede deshacer.")){setOrders([]);notify("Pedidos eliminados");}}} className="btn-danger-ghost">
                          Borrar todos los pedidos
                        </button>
                      </div>
                    </>
                  )}
                </div>
              )}

              {/* POR COLABORADOR */}
              {tab==="everyone"&&auth.role==="coordinator"&&<EveryoneView orders={orders} onDelete={deleteOrder}/>}

            </main>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App/>);
  </script>
</body>
</html>
